# MII KDS-Modul Dokument — IG-Publisher-Konfiguration
# Sprache: Deutsch ist führend/verbindlich (KDS-Governance), Englisch optional.
# Modul-Metadaten (id, canonical, packageId, dependencies, publisher) unverändert
# aus der Quelle übernommen (Bestandsschutz). Migriert nach HL7-IG-Publisher-Format.
id: mii-ig-dokument
canonical: https://www.medizininformatik-initiative.de/fhir/ext/modul-dokument
name: MII_IG_Dokument
title: "MII IG Dokument"
description: "Medizininformatik Initiative - KDS-Modul Dokument"
status: draft # draft | active | retired | unknown
version: 2026.0.1
fhirVersion: 4.0.1 # https://www.hl7.org/fhir/valueset-FHIR-version.html
packageId: de.medizininformatikinitiative.kerndatensatz.dokument
copyrightYear: 2026+
releaseLabel: ci-build
license: CC0-1.0 # https://www.hl7.org/fhir/valueset-spdx-license.html
jurisdiction: http://unstats.un.org/unsd/methods/m49/m49.htm#276
publisher:
  name: Medizininformatik-Initiative
  url: https://www.medizininformatik-initiative.de
  email: office@medizininformatik-initiative.de
# Sprachführung: 'de' (nicht 'de-DE') passend zur i18n-Mechanik des IG Publishers.
language: de

dependencies:
  de.ihe-d.terminology: 3.0.1
  de.medizininformatikinitiative.kerndatensatz.base: 2026.0.0
  de.medizininformatikinitiative.kerndatensatz.meta: 2026.0.0
  dvmd.kdl.r4: 2025.0.1
  ihe.formatcode.fhir: 1.4.0
  #ihe-de.iti.xds-vs.r4:
  #  id: ihe-de.iti.xds-vs
  #  uri: https://build.fhir.org/ig/IHE-Germany/ITI.XDS.VS/package.r4.tgz
  #  version: 0.3.30

# --- Mehrsprachigkeit: deutsch führend, englisch optional ---
# /de/ und /en/ werden gebaut. Englische Ressourcen-Supplements (.po) und
# *-en.md-Seiten werden in dieser Migration NICHT erzeugt (deutsch führend);
# sie können später über den separaten Skill ig-translate ergänzt werden.
# Bis dahin zeigt /en/ deutschsprachige Inhalte mit Standardhinweis (erwartet).
parameters:
  i18n-default-lang: de
  i18n-lang:
    - en
  translation-sources:
    - input/translations/en
  path-history: https://www.medizininformatik-initiative.de/fhir/ext/modul-dokument/history.html
  apply-contact: "true"
  apply-jurisdiction: "true"
  apply-publisher: "true"
  autoload-resources: "true"
  shownav: "true"

# --- Narrative Seiten (deutsch) ---
pages:
  index.md:
    title: "Start"
  use-cases.md:
    title: "Anwendungsfälle / Szenarien"
  data-sets.md:
    title: "Datensätze und Beschreibungen"
  uml.md:
    title: "Informationsmodell (UML)"
  conformance.md:
    title: "Konformität"
  compatibility.md:
    title: "Kompatibilität"
  terminology.md:
    title: "Terminologien"
  naming-conventions.md:
    title: "Namenskonventionen (FHIR-Profile)"
  context.md:
    title: "Kontext / Bezüge zu anderen Modulen"
  references.md:
    title: "Referenzen"
  security-privacy.md:
    title: "Sicherheit und Datenschutz"
  downloads.md:
    title: "Downloads"
  changes.md:
    title: "Release Notes / Änderungen"
  translationinfo.md:
    title: "Hinweise zur Mehrsprachigkeit"

# --- Menü (deutsch geführt; nur eine Submenü-Ebene wird vom IG Publisher unterstützt) ---
menu:
  Start: index.html
  Anwendungsfälle:
    Szenarien: use-cases.html
    Datensätze: data-sets.html
    Informationsmodell (UML): uml.html
  Technische Implementierung:
    Konformität: conformance.html
    Kompatibilität: compatibility.html
    Terminologien: terminology.html
    Namenskonventionen: naming-conventions.html
    Sicherheit & Datenschutz: security-privacy.html
  Bezüge zu anderen Modulen: context.html
  Referenzen: references.html
  Artefakte: artifacts.html
  Downloads: downloads.html
  Release Notes: changes.html
  Mehrsprachigkeit: translationinfo.html

instanceOptions:
  # manualSliceOrdering: Slices müssen über ihren Namen (nicht über numerischen Index)
  # referenziert werden. Empfehlung für neue Projekte; aus der Quelle übernommen.
  manualSliceOrdering: true
